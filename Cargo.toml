[package]
name = "live2d-render-plugin"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace — fully decoupled from any parent so the plugin's
# wgpu / cubism-core deps don't unify against the host's, and the
# vendored cubism-core / cubism-core-sys sub-crates resolve cleanly.
[workspace]
members = ["cubism-core", "cubism-core-sys"]

[profile.release]
opt-level = 3
lto = "thin"
debug = 0

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[lib]
name = "live2d_render_plugin"
# cdylib: matrix-built `.so` for dlopen. rlib: in-process linking
# for consumers like examples/qwen-s2s-avatar-plugins.
crate-type = ["cdylib", "rlib"]

# `plugin-export` (default on) gates the `abi_stable` root-module
# symbol for dlopen. Disable when linking multiple plugins as rlibs
# in one binary (symbol collision).
[features]
default = ["plugin-export"]
plugin-export = []

# Path-3 hand-rolled plugin: depends ONLY on the skinny
# `remotemedia-plugin-sdk` umbrella plus the heavy wgpu / Cubism stack
# pinned directly. Does NOT link `remotemedia-core` — that's what lets
# Live2DRenderNode + its wgpu / image / cubism-core dependencies be
# removed from the host's core crate without changing this plugin's
# surface.
#
# `cubism-core` is a sibling workspace member (./cubism-core) that
# transitively pulls in `cubism-core-sys` (./cubism-core-sys), whose
# build script reads `LIVE2D_CUBISM_CORE_DIR` at build time. See
# `cubism-core-sys/CUBISM_SDK.md` for SDK acquisition.
[dependencies]
remotemedia-plugin-sdk = { git = "https://github.com/RemoteMedia-SDK/remotemedia-plugin-sdk" }
abi_stable = "0.11"

async-trait = "0.1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
bytemuck = { version = "1.14", features = ["derive"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
tracing = "0.1"

# Live2D rendering stack. wgpu 22.x picks dx12/metal/vulkan via the
# `wgsl` default; we render headless into a texture + read back.
wgpu = { version = "22.1", default-features = false, features = ["dx12", "metal", "wgsl"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"

# Vendored Cubism Core wrapper (this workspace member). See
# ./cubism-core-sys/CUBISM_SDK.md — requires LIVE2D_CUBISM_CORE_DIR at
# build time.
cubism-core = { path = "./cubism-core" }
